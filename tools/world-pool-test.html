<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WebCraft worker pool test</title>
<link rel="icon" href="data:,">
<style>body { background: #111; color: #ddd; font: 13px/1.5 monospace; white-space: pre; margin: 8px; }</style>
</head>
<body>
<div id="out">running…</div>
<script type="module">
// WorkerPool against real module workers (SPEC §8): priorities, cancel, reprioritize, error replies,
// and a worker whose module cannot load (crash -> restarts -> rejection). window.__result when done.
import { WorkerPool, JobCancelledError } from '../src/world/workerpool.js';

const out = document.getElementById('out');
const lines = [];
const log = (t) => { lines.push(t); out.textContent = lines.join('\n'); console.log('[pool-test] ' + t); };
const result = { checks: 0, failed: [] };
const check = (cond, msg) => { result.checks++; if (!cond) { result.failed.push(msg); console.warn('[pool-test] FAILED ' + msg); } };

try {
  // ---- real workers: one worker, one job in flight, so the dispatch order is observable ----
  const pool = new WorkerPool(1, { maxInFlight: 1 });
  pool.init(12345, 'default');
  const order = [];
  const jobs = [];
  const prios = [5, 9, 1, 7, 3, 8, 2, 6, 4, 0];
  prios.forEach((p, i) => {
    jobs.push(pool.submit({ type: 'generate', cx: i, cz: 0 }, p).then((r) => {
      order.push(r.cx);
      check(r.type === 'generated' && r.blocks instanceof Uint8Array && r.blocks.length === 65536, 'generated reply ' + i);
    }));
  });
  // job 0 (priority 5) is dispatched at once; the rest follows priority order
  pool.reprioritize((job) => (job.cx === 1 ? -1 : undefined));      // job 1 (priority 9) jumps the queue
  const cancelled = pool.cancel((job) => job.cx === 3 || job.cx === 5);
  check(cancelled === 2, 'cancelled 2 queued jobs');
  const settled = await Promise.allSettled(jobs);
  const rejected = settled.map((s, i) => [s, i]).filter(([s]) => s.status === 'rejected');
  check(rejected.length === 2 && rejected.every(([s]) => s.reason instanceof JobCancelledError && s.reason.cancelled), 'cancelled jobs reject with JobCancelledError');
  check(JSON.stringify(order) === JSON.stringify([0, 1, 9, 2, 6, 4, 8, 7]), 'dispatch order ' + JSON.stringify(order));
  log(`priority order with real worker: ${JSON.stringify(order)} (cancelled ${cancelled})`);

  // ---- error replies from the worker reject the promise but keep the worker alive ----
  let msg = '';
  try {
    await pool.submit({ type: 'mesh', cx: 0, cz: 0, chunks: [new Uint8Array(7)] }, 0);
  } catch (e) {
    msg = e.message;
  }
  check(/mesh job needs chunks|bad length|Uint8Array/.test(msg), 'error reply message: ' + msg.split('\n')[0]);
  const again = await pool.submit({ type: 'generate', cx: 0, cz: 0 }, 0);
  check(again.type === 'generated', 'worker alive after an error reply');
  log(`error reply -> rejected ("${msg.split('\n')[0]}"), worker still alive`);

  // ---- 8 workers in parallel ----
  const big = new WorkerPool(8);
  big.init(777, 'default');
  const t0 = performance.now();
  await Promise.all(Array.from({ length: 64 }, (_, i) => big.submit({ type: 'generate', cx: i % 8, cz: i >> 3 }, i)));
  const ms = performance.now() - t0;
  log(`64 chunks generated by 8 workers in ${ms.toFixed(0)} ms (${(ms / 64).toFixed(1)} ms/chunk wall)`);
  check(big.pending === 0, 'big pool drained');
  big.terminate();
  let terminated = false;
  try { await big.submit({ type: 'generate', cx: 0, cz: 0 }, 0); } catch (e) { terminated = /terminated/.test(e.message); }
  check(terminated, 'submit after terminate rejects');
  pool.terminate();

  // ---- a worker whose module cannot load: restarts, then every job rejects (errors are expected here) ----
  const errors = [];
  const origError = console.error;
  console.error = (...a) => errors.push(a.join(' '));
  let created = 0;
  const broken = new WorkerPool(2, {
    createWorker: () => { created++; return new Worker(new URL('./does-not-exist-worker.js', import.meta.url), { type: 'module' }); },
  });
  broken.init(1, 'default');
  const outcome = await Promise.allSettled([0, 1, 2, 3].map((i) => broken.submit({ type: 'generate', cx: i, cz: 0 }, i)));
  // give the restarted workers time to fail as well
  for (let k = 0; k < 60 && broken.liveWorkers > 0; k++) await new Promise((r) => setTimeout(r, 100));
  const late = await Promise.allSettled([broken.submit({ type: 'generate', cx: 9, cz: 9 }, 0)]);
  console.error = origError;
  check(outcome.every((o) => o.status === 'rejected'), 'jobs on a broken worker reject');
  check(broken.liveWorkers === 0 && created === 8, `workers restarted 3x each then marked dead (created ${created})`);
  check(late[0].status === 'rejected' && /no live workers/.test(late[0].reason.message), 'submit with no live workers rejects');
  check(errors.some((e) => e.includes('crashed')), 'crash reported via console.error');
  log(`broken worker module: ${outcome.filter((o) => o.status === 'rejected').length}/4 jobs rejected, ${created} workers created ` +
    `(2 + 3 restarts each), ${errors.length} console.error reports captured`);
} catch (err) {
  result.failed.push('exception: ' + (err && err.stack || err));
}
log(result.failed.length ? `FAILED: ${result.failed.join('; ')}` : `all ${result.checks} checks passed`);
if (result.failed.length) console.error('[pool-test] ' + result.failed.join('; '));
window.__result = result;
</script>
</body>
</html>
