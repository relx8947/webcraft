<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WebCraft player sandbox</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .ov { position: fixed; inset: 0; pointer-events: none; }
  #flash { background: radial-gradient(ellipse at center, rgba(255,0,0,0) 30%, rgba(200,0,0,0.65) 100%); opacity: 0; }
  #water { background: rgba(30, 60, 160, 0.25); display: none; }
  #lava { background: rgba(220, 80, 0, 0.55); display: none; }
  #hud { position: fixed; left: 6px; top: 4px; color: #fff; font: 13px/1.35 monospace; text-shadow: 1px 1px 0 #000;
         white-space: pre; pointer-events: none; }
  #log { position: fixed; right: 8px; top: 4px; color: #ddd; font: 12px/1.3 monospace; text-shadow: 1px 1px 0 #000;
         white-space: pre; pointer-events: none; text-align: right; }
  #cross { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none;
           mix-blend-mode: difference; }
  #cross:before, #cross:after { content: ''; position: absolute; background: #fff; }
  #cross:before { left: 8px; top: 0; width: 2px; height: 18px; }
  #cross:after { left: 0; top: 8px; width: 18px; height: 2px; }
  #bars { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); width: 364px; color: #fff;
          font: 13px monospace; text-shadow: 1px 1px 0 #000; display: flex; justify-content: space-between; pointer-events: none; }
  #hotbar { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 2px; pointer-events: none; }
  .slot { width: 38px; height: 38px; background: rgba(40,40,40,0.75); border: 2px solid #777; color: #fff;
          font: 10px/1.1 sans-serif; text-align: center; position: relative; overflow: hidden; }
  .slot.sel { border-color: #fff; background: rgba(90,90,90,0.85); }
  .slot .n { position: absolute; right: 2px; bottom: 1px; font: bold 11px monospace; text-shadow: 1px 1px 0 #000; }
  .slot .d { position: absolute; left: 2px; right: 2px; bottom: 0; height: 2px; background: #4c4; }
  #death { position: fixed; inset: 0; background: rgba(120, 0, 0, 0.45); color: #fff; display: none; flex-direction: column;
           align-items: center; justify-content: center; font: 22px sans-serif; text-shadow: 2px 2px 0 #300; }
  #death button { margin-top: 18px; font: 16px sans-serif; padding: 6px 28px; pointer-events: auto; }
  #help { position: fixed; left: 6px; bottom: 6px; color: #ccc; font: 11px/1.3 monospace; text-shadow: 1px 1px 0 #000;
          white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="water" class="ov"></div>
<div id="lava" class="ov"></div>
<div id="flash" class="ov"></div>
<div id="cross"></div>
<div id="hud">loading…</div>
<div id="log"></div>
<div id="bars"><span id="hp"></span><span id="air"></span></div>
<div id="hotbar"></div>
<div id="help">点击画面锁定鼠标 · WASD 移动 · 空格 跳跃(创造模式双击飞行) · Shift 潜行 · Ctrl/双击W 疾跑
左键 破坏 · 右键 放置/使用 · 中键 选取方块 · Q 丢弃(Ctrl+Q 整组) · 1-9/滚轮 切换 · G 切换模式 · R 重生点</div>
<div id="death"><div>你死了！</div><div id="deathmsg"></div><button id="respawn">重生</button></div>
<script type="module" src="player-test.mjs"></script>
</body>
</html>
